[package]
name = "memnoth-coord"
version = "0.1.0-beta.1"
license.workspace = true
edition = "2024"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
# Checkpoints serialise to JSON on disk (continuity.rs), so this is a runtime
# dependency: the sweep dropped it while that code still needed it.
serde_json = "1"
anyhow = "1"
