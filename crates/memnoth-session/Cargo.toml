[package]
name = "memnoth-session"
version = "0.1.0-beta.1"
license.workspace = true
edition = "2024"
description = "The turn log: session file format, receipts and rewinds, with no runtime in it"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
