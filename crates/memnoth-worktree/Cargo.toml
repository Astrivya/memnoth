[package]
name = "memnoth-worktree"
version = "0.1.0-beta.1"
license.workspace = true
edition = "2024"

[dependencies]
anyhow = "1"
memnoth-coord = { path = "../memnoth-coord" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }

[dev-dependencies]
tempfile = "3"