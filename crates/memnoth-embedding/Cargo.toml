[package]
name = "memnoth-embedding"
version = "0.1.0-beta.1"
edition = "2024"
license = "Apache-2.0"
description = "Embedding primitives and cross-encoder reranker"
repository = "https://github.com/astrivya/memnoth"

[features]
default = []
onnx = []

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ndarray = "0.16"
thiserror = "1"