[package]
name = "memnoth-lsp"
version = "0.1.0-beta.2"
edition = "2024"
license = "Apache-2.0"
description = "memnoth language-server client: JSON-RPC over stdio, lifecycle, document sync"
repository = "https://github.com/astrivya/memnoth"

[dependencies]
anyhow = "1"
memnoth-codegraph = { version = "0.1.0-beta.2", path = "../memnoth-codegraph" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
