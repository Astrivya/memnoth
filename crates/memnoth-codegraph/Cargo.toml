[package]
name = "memnoth-codegraph"
version = "0.1.0-beta.1"
edition = "2024"
license = "Apache-2.0"
description = "Code graph indexing and querying"
repository = "https://github.com/astrivya/memnoth"

[features]
default = []
semantic = []

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"