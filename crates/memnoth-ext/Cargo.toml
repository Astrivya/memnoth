[package]
name = "memnoth-ext"
version = "0.1.0-beta.2"
license.workspace = true
edition = "2024"
publish = false
description = "memnoth extension format: .memnoth/extensions/<name>/extension.toml bundling agents, skills, commands, hooks, MCP, themes, README"

[lib]
name = "memnoth_ext"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
dirs = "6"
thiserror = "1"

memnoth-command = { path = "../memnoth-command" }
memnoth-capability = { path = "../memnoth-capability" }
memnoth-skills = { path = "../memnoth-skills" }
[dev-dependencies]
tempfile = "3"
