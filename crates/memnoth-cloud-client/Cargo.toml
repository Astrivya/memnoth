[package]
name = "memnoth-cloud-client"
version = "0.1.0-beta.2"
license.workspace = true
edition = "2024"
description = "Typed HTTP client for the memnoth cloud API: device auth, me, usage, credits, models, projects, orgs, MCP token, ingest, keys"
publish = false
[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
mockito = "1"