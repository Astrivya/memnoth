[package]
name = "memnoth-auth"
version = "0.1.0-beta.2"
edition = "2024"
license = "Apache-2.0"
description = "Credential storage, token caching, and authentication helpers for memnoth"
repository = "https://github.com/astrivya/memnoth"
homepage = "https://memnoth.astrivya.ai"
publish = false

[dependencies]
keyring = "4"
regex = "1"
chrono = { version = "0.4", features = ["clock", "std"] }
memnoth-engine = { path = "../memnoth-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "fs", "macros", "sync"] }
dirs = "5"
anyhow = "1"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
