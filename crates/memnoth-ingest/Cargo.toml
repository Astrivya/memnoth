[package]
name = "memnoth-ingest"
version = "0.1.0-beta.1"
edition = "2024"
license = "Apache-2.0"
description = "Directory ingestion into the memnoth vault"
repository = "https://github.com/astrivya/memnoth"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"

[dependencies.memnoth-engine]
path = "../memnoth-engine"