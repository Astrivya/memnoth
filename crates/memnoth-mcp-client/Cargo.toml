[package]
name = "memnoth-mcp-client"
version = "0.1.0-beta.1"
license.workspace = true
edition = "2024"
description = "MCP client core: stdio and Streamable HTTP transports, tool schema cache, health"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Streamable HTTP is one POST per message with a JSON or SSE reply; reqwest is already in the
# graph for the runtime, so this adds no package.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "rustls-tls-native-roots"] }

[dev-dependencies]
tempfile = "3"
