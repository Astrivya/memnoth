[package]
name = "memnoth-provider-config"
version = "0.1.0-beta.2"
edition = "2024"
license = "Apache-2.0"
description = "Provider configuration with secure API key storage for memnoth"
repository = "https://github.com/astrivya/memnoth"
homepage = "https://memnoth.astrivya.ai"
publish = false

[dependencies]
memnoth-auth = { path = "../memnoth-auth" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock", "std"] }
anyhow = "1"
thiserror = "1"
dirs = "5"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
async-trait = "0.1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"