[package]
name = "memnoth-ui"
version = "0.1.0-beta.1"
license.workspace = true
edition = "2024"
description = "Reusable ratatui widgets extracted from the memnoth TUI"
publish = false

[dependencies]
anyhow = "1"
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
