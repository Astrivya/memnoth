# memnoth — the local product: one binary for the session, the temporal vault,
# the code graph and the MCP server.
#
# This manifest is both the CLI package and the workspace root. Members inherit
# `license.workspace`, so a root without `[workspace.package]` made every crate
# unparseable; the binary lives here (not in `crates/`) because that is the
# layout the MCP crate's own version test reads: it resolves
# `crates/memnoth-mcp/../../Cargo.toml` and expects a `[package] version` there.
#
# `crates/memnoth-mcp` was excluded because five of its path dependencies
# (`memnoth-codegraph`, `memnoth-ingest`, `memnoth-embedding`,
# `memnoth-harness-api`, `memnoth-transport`) were not published in this repo.
# Those crates are now vendored (minimal viable versions) and `memnoth-mcp` is
# back in the workspace members list.

[package]
name = "memnoth"
version = "0.1.0-beta.2"
edition = "2024"
license = "Apache-2.0"
description = "Terminal agent, bi-temporal vault, code graph and MCP server"
repository = "https://github.com/astrivya/memnoth"
homepage = "https://memnoth.astrivya.ai"
default-run = "memnoth"

[[bin]]
name = "memnoth"
path = "src/main.rs"

[[bin]]
name = "mn"
path = "src/bin/mn.rs"

[lib]
name = "memnoth"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
hex = "0.4"
# Client-side encrypted sync (C-03): recovery-phrase KDF, authenticated
# ciphertext, and content addressing. The server never receives the phrase or
# the key; it stores only the envelope and its BLAKE3 digest.
argon2 = "0.5"
blake3 = "1"
chacha20poly1305 = "0.10"
getrandom = "0.3"
zeroize = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
crossterm = "0.28"
dirs = "6"
flate2 = "1"
memnoth-command = { version = "0.1.0-beta.2", path = "crates/memnoth-command" }
memnoth-codegraph = { version = "0.1.0-beta.2", path = "crates/memnoth-codegraph" }
memnoth-update = { version = "0.1.0-beta.2", path = "crates/memnoth-update" }
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
    "rustls-tls-native-roots",
] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
memnoth-capability = { version = "0.1.0-beta.2", path = "crates/memnoth-capability" }
memnoth-context = { version = "0.1.0-beta.2", path = "crates/memnoth-context" }
memnoth-coord = { version = "0.1.0-beta.2", path = "crates/memnoth-coord" }
memnoth-engine = { version = "0.1.0-beta.2", path = "crates/memnoth-engine" }
memnoth-harness-api = { version = "0.1.0-beta.2", path = "crates/memnoth-harness-api" }
memnoth-transport = { version = "0.1.0-beta.2", path = "crates/memnoth-transport" }
memnoth-mcp-client = { version = "0.1.0-beta.2", path = "crates/memnoth-mcp-client" }
memnoth-sandbox = { version = "0.1.0-beta.2", path = "crates/memnoth-sandbox" }
memnoth-search = { version = "0.1.0-beta.2", path = "crates/memnoth-search" }
memnoth-agent = { version = "0.1.0-beta.2", path = "crates/memnoth-agent" }
memnoth-session = { version = "0.1.0-beta.2", path = "crates/memnoth-session" }
memnoth-cloud-client = { version = "0.1.0-beta.2", path = "crates/memnoth-cloud-client" }
memnoth-ui = { version = "0.1.0-beta.2", path = "crates/memnoth-ui" }
memnoth-auth = { version = "0.1.0-beta.2", path = "crates/memnoth-auth" }
memnoth-provider-config = { version = "0.1.0-beta.2", path = "crates/memnoth-provider-config" }
memnoth-lsp = { version = "0.1.0-beta.2", path = "crates/memnoth-lsp" }
memnoth-provider-registry = { version = "0.1.0-beta.2", path = "crates/memnoth-provider-registry" }
memnoth-skills = { version = "0.1.0-beta.2", path = "crates/memnoth-skills" }
memnoth-worktree = { version = "0.1.0-beta.2", path = "crates/memnoth-worktree" }
axum = "0.8"
notify = "8"
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
tempfile = "3"
# tests/update_local_release.rs stages a release the way dist.sh does and then
# installs it onto a copy of the binary, so the archive reader under test is the
# updater's own rather than a second packaging path.
zip = "9"
tower = { version = "0.5", features = ["util"] }
# tests/tui_pty.rs runs the real binary behind an 80x24 pty: ConPTY on Windows,
# forkpty on unix. vt100 parses the byte stream back into a screen.
portable-pty = "0.9"
vt100 = "0.15"

# The agent host starts processes with no console at all; ConPTY's child fails
# DLL initialisation (0xC0000142) until one exists. tests/tui_pty.rs allocates it.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }
[workspace]
resolver = "3"
members = [
    "crates/memnoth-agent",
    "crates/memnoth-capability",
    "crates/memnoth-codegraph",
    "crates/memnoth-command-macros",
    "crates/memnoth-context",
    "crates/memnoth-coord",
    "crates/memnoth-embedding",
    "crates/memnoth-embedding-wasm",
    "crates/memnoth-ext",
    "crates/memnoth-engine",
    "crates/memnoth-harness-api",
    "crates/memnoth-ingest",
    "crates/memnoth-lsp",
    "crates/memnoth-mcp",
    "crates/memnoth-mcp-auth",
    "crates/memnoth-mcp-client",
    "crates/memnoth-protocol-v2",
    "crates/memnoth-sandbox",
    "crates/memnoth-search",
    "crates/memnoth-transport",
    "crates/memnoth-ui",
    "crates/memnoth-update",
    "crates/memnoth-worktree",
    "crates/memnoth-cloud-client",
    "crates/memnoth-command",
    "crates/memnoth-auth",
    "crates/memnoth-provider-config",
    "crates/memnoth-skills",
    "crates/memnoth-provider-registry",
    "fuzz",
]
# The server is part of the product, not an optional extra: a plain `cargo build`
# must emit `memnoth-mcp` beside `memnoth`, or the CLI's resolver falls through to
# `PATH` and can find a server from an older install. `default-run` keeps
# `cargo run` on the CLI itself.
default-members = [".", "crates/memnoth-mcp"]
exclude = []

[workspace.package]
license = "Apache-2.0"
repository = "https://github.com/astrivya/memnoth"
homepage = "https://memnoth.astrivya.ai"
