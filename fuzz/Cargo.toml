[package]
name = "memnoth-fuzz"
version = "0.1.0-beta.2"
edition = "2024"
publish = false
description = "cargo-fuzz targets for memnoth hardening (Phase 8 / W12-04)"

[dependencies]
memnoth-harness-api = { path = "../crates/memnoth-harness-api" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `fuzz_target!` entry points the libfuzzer engine links against.
libfuzzer-sys = "0.4"

[profile.release]
opt-level = 3

