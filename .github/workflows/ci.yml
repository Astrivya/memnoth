name: CI

# This repository is the product: the `memnoth` binary and its library crates.
# The site and the control plane live elsewhere with their own pipelines, so
# every gate here is about this workspace and nothing else.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's answer obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # The whole workspace, not just the binary: every crate is formatted, so a
      # new member cannot arrive unformatted.
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # Preserve workspace artifacts so repeat checks avoid recompiling
          # unchanged local crates; Cargo fingerprints still invalidate edits.
          cache-workspace-crates: "true"

      # `-D warnings` across the workspace and all targets: a new warning fails
      # review here instead of accumulating in a library nobody reads.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  generated:
    name: generated surfaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Every artifact is generated from the one command registry. A stale file
      # fails here instead of shipping a reference, man page, schema or
      # completion list that describes a different binary.
      - name: Markdown reference
        run: cargo run --quiet -- docs --output contract/command-surface.md --check
      - name: Man page
        run: cargo run --quiet -- docs --man --output contract/memnoth.1 --check
      - name: Registry schema
        run: cargo run --quiet -- schema --output contract/commands.json --check
      - name: Bash completion
        run: cargo run --quiet -- completion show --shell bash --output completions/memnoth.bash --check
      - name: Standalone MCP package surface
        run: python3 scripts/check_surface.py
      - name: npm stable-tag monotonicity
        run: node scripts/npm-dist-tag.mjs --self-test

      - name: Release notes consistency
        run: python3 scripts/check-release-notes.py --root ..

      # Also exercise the command crate's direct entry point without paying for
      # another runner and another cache restore.
      - name: Command crate docs reference
        run: cargo run --quiet -p memnoth-command -- docs --check
      - name: Command crate registry schema
        run: cargo run --quiet -p memnoth-command -- schema --check

  # The tree-sitter grammars are C/C++ sources compiled by each crate's
  # build.rs; a plain `cargo check` of the workspace only exercises the host C
  # compiler. Check the eight tree-sitter crates (runtime + seven grammars used
  # by memnoth-codegraph) against every release target so a grammar that only
  # builds on one toolchain fails here, not in a release build. `cargo check`
  # still runs the build scripts (so the cross C compiler is exercised) while
  # skipping linking and the release optimiser, which keeps the gate cheap.
  # The target list mirrors .github/workflows/release.yml; the crate list lives
  # in scripts/check-tree-sitter-targets.sh so there is one place to update.
  tree-sitter-targets:
    name: tree-sitter grammars (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          # No hosted aarch64 Linux runner; cross's image also pins the glibc
          # version, matching how the release binary for this target is built.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
    steps:
      - uses: actions/checkout@v4

      # Non-cross legs need the target's std for `cargo check --target`. The
      # cross leg uses cross's Docker images and does not need a host target.
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.cross }}
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          # One cache per target: a C grammar is rebuilt per target anyway, and
          # a shared key would only thrash. The target name keeps cells separate.
          key: tree-sitter-targets-${{ matrix.target }}

      - name: install cross
        if: ${{ matrix.cross }}
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          # Same pin as release.yml; `tool: cross` resolves to a fixed version.
          tool: cross

      - name: Check tree-sitter grammars for ${{ matrix.target }}
        shell: bash
        env:
          TS_USE_CROSS: ${{ matrix.cross && '1' || '0' }}
        run: bash scripts/check-tree-sitter-targets.sh "${{ matrix.target }}"

  # Build each platform's test binaries once, then execute the inventory
  # without recompiling. Non-Windows uses one workspace archive fanned out to
  # three shards; Windows gives every workspace member its own `-p <pkg>`
  # archive and splits the root CLI package into small lib/bin/integration-test
  # groups, each executed by a single dedicated job. Doctests stay explicit
  # Cargo runs because nextest archives do not include them.
  test-archive:
    name: test archive (${{ matrix.os }}, ${{ matrix.scope }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            scope: workspace
            archive_args: --workspace
            doctests: true
          - os: macos-latest
            scope: workspace
            archive_args: --workspace
            doctests: true

          # One Windows archive per workspace member. A single `-p` scope keeps
          # each job small and stops a slow dependency tree from delaying an
          # unrelated crate. Every package is archived in exactly one scope.
          # `memnoth-session` is an implicit member (a path dependency of the
          # root package) and is listed here so its tests keep running.
          - os: windows-latest
            scope: memnoth-agent
            archive_args: "-p memnoth-agent"
            doctests: false
          - os: windows-latest
            scope: memnoth-auth
            archive_args: "-p memnoth-auth"
            doctests: false
          - os: windows-latest
            scope: memnoth-capability
            archive_args: "-p memnoth-capability"
            doctests: false
          - os: windows-latest
            scope: memnoth-cloud-client
            archive_args: "-p memnoth-cloud-client"
            doctests: false
          - os: windows-latest
            scope: memnoth-codegraph
            archive_args: "-p memnoth-codegraph"
            doctests: false
          - os: windows-latest
            scope: memnoth-command
            archive_args: "-p memnoth-command"
            doctests: false
          - os: windows-latest
            scope: memnoth-command-macros
            archive_args: "-p memnoth-command-macros"
            doctests: false
          - os: windows-latest
            scope: memnoth-context
            archive_args: "-p memnoth-context"
            doctests: false
          - os: windows-latest
            scope: memnoth-coord
            archive_args: "-p memnoth-coord"
            doctests: false
          - os: windows-latest
            scope: memnoth-embedding
            archive_args: "-p memnoth-embedding"
            doctests: false
          - os: windows-latest
            scope: memnoth-embedding-wasm
            archive_args: "-p memnoth-embedding-wasm"
            doctests: false
          - os: windows-latest
            scope: memnoth-engine
            archive_args: "-p memnoth-engine"
            doctests: false
          - os: windows-latest
            scope: memnoth-ext
            archive_args: "-p memnoth-ext"
            doctests: false
          - os: windows-latest
            scope: memnoth-fuzz
            archive_args: "-p memnoth-fuzz"
            doctests: false
          - os: windows-latest
            scope: memnoth-harness-api
            archive_args: "-p memnoth-harness-api"
            doctests: false
          - os: windows-latest
            scope: memnoth-ingest
            archive_args: "-p memnoth-ingest"
            doctests: false
          - os: windows-latest
            scope: memnoth-lsp
            archive_args: "-p memnoth-lsp"
            doctests: false
          - os: windows-latest
            scope: memnoth-mcp
            archive_args: "-p memnoth-mcp"
            doctests: false
          - os: windows-latest
            scope: memnoth-mcp-auth
            archive_args: "-p memnoth-mcp-auth"
            doctests: false
          - os: windows-latest
            scope: memnoth-mcp-client
            archive_args: "-p memnoth-mcp-client"
            doctests: false
          - os: windows-latest
            scope: memnoth-protocol-v2
            archive_args: "-p memnoth-protocol-v2"
            doctests: false
          - os: windows-latest
            scope: memnoth-provider-config
            archive_args: "-p memnoth-provider-config"
            doctests: false
          - os: windows-latest
            scope: memnoth-provider-registry
            archive_args: "-p memnoth-provider-registry"
            doctests: false
          - os: windows-latest
            scope: memnoth-sandbox
            archive_args: "-p memnoth-sandbox"
            doctests: false
          - os: windows-latest
            scope: memnoth-search
            archive_args: "-p memnoth-search"
            doctests: false
          - os: windows-latest
            scope: memnoth-session
            archive_args: "-p memnoth-session"
            doctests: false
          - os: windows-latest
            scope: memnoth-skills
            archive_args: "-p memnoth-skills"
            doctests: false
          - os: windows-latest
            scope: memnoth-transport
            archive_args: "-p memnoth-transport"
            doctests: false
          - os: windows-latest
            scope: memnoth-ui
            archive_args: "-p memnoth-ui"
            doctests: false
          - os: windows-latest
            scope: memnoth-update
            archive_args: "-p memnoth-update"
            doctests: false
          - os: windows-latest
            scope: memnoth-worktree
            archive_args: "-p memnoth-worktree"
            doctests: false

          # The root `memnoth` package: library, binaries, then its integration
          # tests in four small explicit-target groups. Every tests/*.rs file
          # is in exactly one group. The installer parser check rides with
          # cli-tests-2, which owns tests/install_scripts.rs.
          - os: windows-latest
            scope: cli-lib
            archive_args: "-p memnoth --lib"
            doctests: false
          - os: windows-latest
            scope: cli-bins
            archive_args: "-p memnoth --bins"
            doctests: false
          - os: windows-latest
            scope: cli-tests-1
            archive_args: >-
              -p memnoth
              --test ask_verb --test cli --test completion_check
              --test config_explain --test demo_verb --test destructive_no_tty
              --test docs_check
            doctests: false
          - os: windows-latest
            scope: cli-tests-2
            archive_args: >-
              -p memnoth
              --test docs_man --test exit_code_table --test exit_codes
              --test help_verb --test install_scripts --test provider
              --test registry_parity
            doctests: false
          - os: windows-latest
            scope: cli-tests-3
            archive_args: >-
              -p memnoth
              --test mcp_add --test release_manifest --test schema_verb
              --test security --test serve_auth --test slash_hierarchy
              --test surfaces --test sync_crypto
            doctests: false
          - os: windows-latest
            scope: cli-tests-4
            archive_args: >-
              -p memnoth
              --test setup_end_to_end --test tui_pty --test update_local_release
              --test update_signed_release --test vault_invariants
              --test version_surfaces --test version_verb
            doctests: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.0

      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: "true"

      - name: Install nextest
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: nextest@0.9.150

      # Each matrix row is a disjoint, self-contained scope. The Windows name
      # omits `-latest` so the artifact and archive are exactly
      # `nextest-windows-<scope>[.tar.zst]`; every scope is executed by its own
      # single-slice test job rather than by every shard.
      - name: Build and archive ${{ matrix.scope }} tests
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            archive="nextest-windows-${{ matrix.scope }}.tar.zst"
          else
            archive="nextest-workspace.tar.zst"
          fi
          cargo nextest archive ${{ matrix.archive_args }} --locked --archive-file "$archive"

      # The Windows installer is shipped and run as PowerShell 5.1, but no
      # Rust test executes it. Parse it on Windows so script syntax stays a
      # required cross-platform CI check. The old `scope == 'cli'` condition
      # never matched a real scope; cli-tests-2 owns install_scripts.rs.
      - name: Windows installer parses
        if: runner.os == 'Windows' && matrix.scope == 'cli-tests-2'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/install.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Run workspace doctests
        if: matrix.doctests
        run: cargo test --workspace --doc --locked

      - name: Upload test archive
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nextest-${{ matrix.os }}-${{ matrix.scope }}
          path: nextest-workspace.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload Windows scope archive
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nextest-windows-${{ matrix.scope }}
          path: nextest-windows-${{ matrix.scope }}.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  test:
    name: test (${{ matrix.os }}, ${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    needs: test-archive
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shard: 1
            shards: 3
            label: 1/3
          - os: ubuntu-latest
            shard: 2
            shards: 3
            label: 2/3
          - os: ubuntu-latest
            shard: 3
            shards: 3
            label: 3/3
          - os: macos-latest
            shard: 1
            shards: 3
            label: 1/3
          - os: macos-latest
            shard: 2
            shards: 3
            label: 2/3
          - os: macos-latest
            shard: 3
            shards: 3
            label: 3/3

          # One execution job per Windows archive. Each downloads only its own
          # artifact and runs the single slice 1/1, so no shard downloads or
          # extracts the other archives and no tests are skipped by partitioning.
          - os: windows-latest
            scope: memnoth-agent
            label: memnoth-agent
          - os: windows-latest
            scope: memnoth-auth
            label: memnoth-auth
          - os: windows-latest
            scope: memnoth-capability
            label: memnoth-capability
          - os: windows-latest
            scope: memnoth-cloud-client
            label: memnoth-cloud-client
          - os: windows-latest
            scope: memnoth-codegraph
            label: memnoth-codegraph
          - os: windows-latest
            scope: memnoth-command
            label: memnoth-command
          - os: windows-latest
            scope: memnoth-command-macros
            label: memnoth-command-macros
          - os: windows-latest
            scope: memnoth-context
            label: memnoth-context
          - os: windows-latest
            scope: memnoth-coord
            label: memnoth-coord
          - os: windows-latest
            scope: memnoth-embedding
            label: memnoth-embedding
          - os: windows-latest
            scope: memnoth-embedding-wasm
            label: memnoth-embedding-wasm
          - os: windows-latest
            scope: memnoth-engine
            label: memnoth-engine
          - os: windows-latest
            scope: memnoth-ext
            label: memnoth-ext
          - os: windows-latest
            scope: memnoth-fuzz
            label: memnoth-fuzz
          - os: windows-latest
            scope: memnoth-harness-api
            label: memnoth-harness-api
          - os: windows-latest
            scope: memnoth-ingest
            label: memnoth-ingest
          - os: windows-latest
            scope: memnoth-lsp
            label: memnoth-lsp
          - os: windows-latest
            scope: memnoth-mcp
            label: memnoth-mcp
          - os: windows-latest
            scope: memnoth-mcp-auth
            label: memnoth-mcp-auth
          - os: windows-latest
            scope: memnoth-mcp-client
            label: memnoth-mcp-client
          - os: windows-latest
            scope: memnoth-protocol-v2
            label: memnoth-protocol-v2
          - os: windows-latest
            scope: memnoth-provider-config
            label: memnoth-provider-config
          - os: windows-latest
            scope: memnoth-provider-registry
            label: memnoth-provider-registry
          - os: windows-latest
            scope: memnoth-sandbox
            label: memnoth-sandbox
          - os: windows-latest
            scope: memnoth-search
            label: memnoth-search
          - os: windows-latest
            scope: memnoth-session
            label: memnoth-session
          - os: windows-latest
            scope: memnoth-skills
            label: memnoth-skills
          - os: windows-latest
            scope: memnoth-transport
            label: memnoth-transport
          - os: windows-latest
            scope: memnoth-ui
            label: memnoth-ui
          - os: windows-latest
            scope: memnoth-update
            label: memnoth-update
          - os: windows-latest
            scope: memnoth-worktree
            label: memnoth-worktree
          - os: windows-latest
            scope: cli-lib
            label: cli-lib
          - os: windows-latest
            scope: cli-bins
            label: cli-bins
          - os: windows-latest
            scope: cli-tests-1
            label: cli-tests-1
          - os: windows-latest
            scope: cli-tests-2
            label: cli-tests-2
          - os: windows-latest
            scope: cli-tests-3
            label: cli-tests-3
          - os: windows-latest
            scope: cli-tests-4
            label: cli-tests-4
    steps:
      - uses: actions/checkout@v4

      - name: Install nextest
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: nextest@0.9.150

      - name: Download workspace test archive
        if: matrix.os != 'windows-latest'
        uses: actions/download-artifact@v4
        with:
          name: nextest-${{ matrix.os }}-workspace

      # Exactly one artifact per job: the archive named by this job's scope.
      # No wildcard, no merge-multiple, and no six-archive fan-out.
      - name: Download Windows scope archive
        if: matrix.os == 'windows-latest'
        uses: actions/download-artifact@v4
        with:
          name: nextest-windows-${{ matrix.scope }}

      # Non-Windows shards split the workspace archive; each Windows scope runs
      # its own archive as slice 1/1 without invoking Cargo or recompiling test
      # harnesses. Failure detail from either path goes to the step summary.
      - name: Run archived nextest partition
        shell: bash
        run: |
          set -o pipefail
          # Integration tests bake in CARGO_BIN_EXE_* paths at build time.
          # Extract into the workspace root so the archive's target/debug
          # binaries land at the exact paths Cargo recorded during the archive
          # build. --extract-overwrite keeps a pre-existing target/ from
          # blocking extraction; only this job's archive is ever extracted.
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            archive="nextest-windows-${{ matrix.scope }}.tar.zst"
            no_tests=pass
            partition="slice:1/1"
          else
            archive="nextest-workspace.tar.zst"
            no_tests=fail
            partition="slice:${{ matrix.shard }}/${{ matrix.shards }}"
          fi
          log="test-output-${archive}.log"
          cargo-nextest nextest run --archive-file "$archive" --extract-to . --extract-overwrite --no-tests="$no_tests" --partition "$partition" 2>&1 | tee "$log"
          { grep -E "FAILED|panicked at" "$log" | head -40; } >> "$GITHUB_STEP_SUMMARY" || true

  pinned-model-ci:
    name: pinned model CI (N=3 paired, 95% bootstrap CI)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Check out the ref under test (not a pinned ref): this job measures the
      # change being proposed. `fetch-depth: 0` keeps history for any future
      # commit-relative gating.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The evaluation measures a real model behind a real key. Without a key
      # every task scores zero and the job would be red for a reason that has
      # nothing to do with the change under test, so the run is gated on the
      # key's presence: set KILO_API_KEY (or a provider key) as a repository
      # secret and the same steps run in full. The key check comes first: the
      # job used to compile the whole workspace and then evaluate nothing.
      - name: Provider key present?
        id: providerkeys
        env:
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          MEMNOTH_API_KEY: ${{ secrets.MEMNOTH_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KILO_API_KEY$MEMNOTH_API_KEY$OPENAI_API_KEY$ANTHROPIC_API_KEY" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No provider key configured: pinned-model evaluation is skipped."
          fi

      # Build once; every repetition reuses the same binary so measured
      # differences come from the model/effort, not from a rebuild.
      - name: Build memnoth
        if: steps.providerkeys.outputs.have == 'true'
        run: cargo build --locked --bin memnoth

      # N=3 paired repetitions: every (model, effort) pair runs the same
      # tasks under the same seeds. The percentile bootstrap yields a 95%
      # CI on each configuration's mean score; the cost per 1k turns is
      # gated against the pinned price table in ci/manifest.json, which also
      # pins commit, dataset and seed.
      - name: Run pinned model evaluation
        if: steps.providerkeys.outputs.have == 'true'
        run: python ci/eval_bootstrap.py ci/manifest.json
  # Compiling the fuzz targets is the per-push gate: it catches a target that
  # no longer builds against the crates it fuzzes, under nightly with the
  # sanitizer. Running them is a hunt with its own budget, and lives in
  # fuzz.yml on a schedule.
  fuzz:
    name: fuzz (cargo-fuzz targets build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # rust-toolchain.toml pins the workspace to 1.98.0 (stable), and rustup
    # honours it over the nightly installed above: every fuzz step ran the
    # stable rustc and `-Zsanitizer` is rejected on stable. RUSTUP_TOOLCHAIN
    # outranks the toolchain file, so the whole job runs on nightly.
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # Run from the workspace root: cargo-fuzz finds the fuzz crate at
      # `./fuzz` beneath the manifest it is handed, so running from inside
      # `fuzz/` makes it look for `fuzz/fuzz/`. `cargo fuzz build` has no
      # `--locked` flag either (it forwards its own flags to cargo).
      - name: Build fuzz targets
        run: cargo fuzz build

  perf:
    name: release binary budget
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: "true"

      - name: Build release binary
        run: cargo build --release --locked --bin memnoth

      - name: Perf budget gate (W12-05)
        env:
          MN_BIN: ./target/release/memnoth
        run: python3 scripts/perf-budget.py --check

  recall-perf:
    name: recall benchmark (10k beliefs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_PROFILE_BENCH_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: "true"

      # Compile and run only the committed benchmark target. An unscoped
      # `cargo bench --no-run` compiled harnesses for the whole workspace.
      - name: Run the recall benchmark
        run: cargo bench --locked -p memnoth-engine --bench recall -- --quick

  security:
    name: security suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # cargo-deny needs installing and a policy file; both are here now. One
      # tool replaces the old `cargo audit` half of this job: its advisories
      # check reads the same RustSec database. The npm half of this job used
      # to point at `../web` — a second repository that cannot exist in this
      # checkout — so it never ran; the web repo audits its own tree.
      #
      # The cargo-deny-action met rust-toolchain.toml's 1.98.0 pin inside a
      # docker image without it (it demands a musl toolchain it never
      # installed), so cargo-deny runs as a host binary here, on the stable
      # toolchain the step above already put in place.
      # Pinned: the deny.toml schema turned over between 0.18 (the docker
      # action's image) and 0.20 (the registry's latest), and an install
      # that silently follows `latest` would re-break the policy without a
      # line of ours changing.
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: cargo deny check
        run: cargo deny check --all-features --workspace 2>&1 | tee deny-output.log

      # Everything but licenses is report-only until the advisory baseline
      # is clean: `deny.toml` records the allow-list and the reason.

  bench:
    name: bench regression gate (MTS-60 / TRS / KG)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build memnoth
        run: cargo build --locked --bin memnoth

      # MTS and TRS measure a model; without a provider key every task
      # scores zero and the gate fails for want of a credential, not a
      # regression. KG is local and always runs. See the pinned-model job
      # for the same gate.
      - name: Provider key present?
        id: providerkeys
        env:
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          MEMNOTH_API_KEY: ${{ secrets.MEMNOTH_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KILO_API_KEY$MEMNOTH_API_KEY$OPENAI_API_KEY$ANTHROPIC_API_KEY" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No provider key configured: MTS/TRS benches are skipped, KG still runs."
          fi

      # The bench spawns `memnoth ask` for every task (bench.rs reads
      # MEMNOTH_BIN, defaulting to a PATH lookup): the built binary is not on
      # PATH in a fresh checkout, so this died with "spawn memnoth ask: No
      # such file or directory" before any task ran.
      - name: Run MTS-60 bench
        if: steps.providerkeys.outputs.have == 'true'
        env:
          MEMNOTH_BIN: ./target/debug/memnoth
        run: ./target/debug/memnoth bench run --suite mts --n 3 --fail-below 0.5 --json -o ci/mts-result.json

      - name: Run TRS bench
        if: steps.providerkeys.outputs.have == 'true'
        env:
          MEMNOTH_BIN: ./target/debug/memnoth
        run: ./target/debug/memnoth bench run --suite trs --n 3 --fail-below 0.5 --json -o ci/trs-result.json

      - name: Run KG bench
        env:
          MEMNOTH_BIN: ./target/debug/memnoth
        run: ./target/debug/memnoth bench run --suite kg --n 3 --fail-below 0.0 --json -o ci/kg-result.json

  # Fast, model-free benchmark smoke gate. These four lanes are DERIVED
  # DIAGNOSTICS, not official benchmark scores: they run the deterministic
  # verifiers against committed fixtures with no model, no provider key, no
  # network and no 100k-file index probe. This job inherits the workflow's
  # push / PR / workflow_dispatch triggers (it adds no trigger gate), so it runs
  # on every push and pull request. The provider-keyed lanes (MTS-60, the
  # model-backed TRS runs, pinned-model CI) remain separately gated in `bench`
  # and `pinned-model-ci` above. Every lane must exit 0 and report a passing
  # gate, or this job fails.
  bench-smoke:
    name: bench smoke (model-free verifier lanes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the workspace toolchain to 1.98.0; @stable
      # honours that pin, matching the existing `bench` job above.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: "true"

      # Build the CLI once; every lane reuses this single binary.
      - name: Build memnoth
        run: cargo build --locked --bin memnoth

      # One wrapper runs all four lanes with `--json`, captures each stdout as
      # an artifact, and fails on non-zero exit, malformed JSON, ok != true,
      # gate != pass, or any failed case/regression. Nothing is swallowed: a red
      # lane is a red job. `kg-verify` is invoked with no index-budget-root
      # option, so the 100k-file index probe stays out of scope.
      - name: Run model-free bench lanes
        env:
          MN_BIN: ./target/debug/memnoth
          BENCH_SMOKE_OUT: bench-smoke-results
        run: bash scripts/bench-smoke.sh

      # Upload even when a lane fails so the captured JSON is available for
      # debugging; the run step above still fails the job.
      - name: Upload bench-smoke outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-smoke-results
          path: bench-smoke-results/
          if-no-files-found: error
          retention-days: 7
