name: CI

# This repository is the product: the `memnoth` binary and its library crates.
# The site and the control plane live elsewhere with their own pipelines, so
# every gate here is about this workspace and nothing else.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's answer obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # The whole workspace, not just the binary: every crate is formatted, so a
      # new member cannot arrive unformatted.
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # `-D warnings` across the workspace and all targets: a new warning fails
      # review here instead of accumulating in a library nobody reads.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  generated:
    name: generated surfaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Every artifact is generated from the one command registry. A stale file
      # fails here instead of shipping a reference, man page, schema or
      # completion list that describes a different binary.
      - name: Markdown reference
        run: cargo run --quiet -- docs --output contract/command-surface.md --check
      - name: Man page
        run: cargo run --quiet -- docs --man --output contract/memnoth.1 --check
      - name: Registry schema
        run: cargo run --quiet -- schema --output contract/commands.json --check
      - name: Bash completion
        run: cargo run --quiet -- completion show --shell bash --output completions/memnoth.bash --check

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The Windows installer is shipped and run as PowerShell 5.1, but no
      # Rust test executes it. Parse it on the Windows leg so an indentation or
      # quoting mistake in a here-string fails here instead of at install time.
      - name: Windows installer parses
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/install.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      # The whole workspace, not just the binary: the vault, graph and session
      # behaviour the CLI is a thin shell over is tested in those crates.
      # `--locked` also fails here when Cargo.lock drifts from a manifest.
      # The output lands in the job summary: a red step that names no failing
      # test is where a morning used to go. Pinned to bash: `set -o pipefail`
      # is not PowerShell, and windows-latest runs run: steps in pwsh, so the
      # step died before cargo did and the job reported failure for nothing.
      - name: Run cargo test --workspace --locked
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee test-output.log
          { grep -E "FAILED|panicked at" test-output.log | head -40; } >> "$GITHUB_STEP_SUMMARY" || true

  generated-surfaces-ci:
    name: generated surfaces (memnoth-command)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Generated surfaces validated against the memnoth-command crate directly.
      # `--check` fails when the checked-in surface is stale.
      - name: Docs reference
        run: cargo run -p memnoth-command -- docs --check
      - name: Registry schema
        run: cargo run -p memnoth-command -- schema --check

  pinned-model-ci:
    name: pinned model CI (N=3 paired, 95% bootstrap CI)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Check out the ref under test (not a pinned ref): this job measures the
      # change being proposed. `fetch-depth: 0` keeps history for any future
      # commit-relative gating.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Build once; every repetition reuses the same binary so measured
      # differences come from the model/effort, not from a rebuild.
      - name: Build memnoth
        run: cargo build --locked --bin memnoth

      # The evaluation measures a real model behind a real key. Without a key
      # every task scores zero and the job would be red for a reason that has
      # nothing to do with the change under test, so the run is gated on the
      # key's presence: set KILO_API_KEY (or a provider key) as a repository
      # secret and the same steps run in full.
      - name: Provider key present?
        id: providerkeys
        env:
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          MEMNOTH_API_KEY: ${{ secrets.MEMNOTH_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KILO_API_KEY$MEMNOTH_API_KEY$OPENAI_API_KEY$ANTHROPIC_API_KEY" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No provider key configured: pinned-model evaluation is skipped."
          fi

      # N=3 paired repetitions: every (model, effort) pair runs the same
      # tasks under the same seeds. The percentile bootstrap yields a 95%
      # CI on each configuration's mean score; the cost per 1k turns is
      # gated against the pinned price table in ci/manifest.json, which also
      # pins commit, dataset and seed.
      - name: Run pinned model evaluation
        if: steps.providerkeys.outputs.have == 'true'
        run: python ci/eval_bootstrap.py ci/manifest.json
  fuzz:
    name: fuzz (cargo-fuzz targets)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # rust-toolchain.toml pins the workspace to 1.98.0 (stable), and rustup
    # honours it over the nightly installed above: every fuzz step ran the
    # stable rustc and `-Zsanitizer` is rejected on stable. RUSTUP_TOOLCHAIN
    # outranks the toolchain file, so the whole job runs on nightly.
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # Run from the workspace root: cargo-fuzz finds the fuzz crate at
      # `./fuzz` beneath the manifest it is handed, so running from inside
      # `fuzz/` makes it look for `fuzz/fuzz/`. `cargo fuzz build` has no
      # `--locked` flag either (it forwards its own flags to cargo).
      - name: Build fuzz targets
        run: cargo fuzz build

      # Two flags that are not flags: `--max_total_time` belongs to libFuzzer
      # (so it comes after `--`), and the release switch is `-O`, not `-r` —
      # cargo-fuzz 0.13 rejects both, and the step died before fuzzing.
      - name: Run fuzz targets on seed corpus
        run: |
          for target in config mcp_framing diff_parsing provider_url sync_manifest frontmatter security; do
            cargo fuzz run "$target" -O -- --max_total_time=60
          done

  perf:
    name: benchmarks compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --bin memnoth

      # There is no bench target and no committed baseline yet, so there is
      # nothing to compare against. This step proves the benchmark code still
      # compiles; a step that ended in `|| true` was not a gate, and calling it
      # one was the drift this replaces.
      - name: Compile benchmarks
        run: cargo bench --locked --no-run

      - name: Perf budget gate (W12-05)
        env:
          MN_BIN: ./target/release/memnoth
        run: python3 scripts/perf-budget.py --check

      - name: Recall bench at 10k beliefs (W12-05)
        run: cargo bench --locked -p memnoth-engine --bench recall -- --quick

  security:
    name: security suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # cargo-deny needs installing and a policy file; both are here now. One
      # tool replaces the old `cargo audit` half of this job: its advisories
      # check reads the same RustSec database. The npm half of this job used
      # to point at `../web` — a second repository that cannot exist in this
      # checkout — so it never ran; the web repo audits its own tree.
      #
      # The cargo-deny-action met rust-toolchain.toml's 1.98.0 pin inside a
      # docker image without it (it demands a musl toolchain it never
      # installed), so cargo-deny runs as a host binary here, on the stable
      # toolchain the step above already put in place.
      # Pinned: the deny.toml schema turned over between 0.18 (the docker
      # action's image) and 0.20 (the registry's latest), and an install
      # that silently follows `latest` would re-break the policy without a
      # line of ours changing.
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: cargo deny check
        run: cargo deny check --all-features --workspace 2>&1 | tee deny-output.log

      # Everything but licenses is report-only until the advisory baseline
      # is clean: `deny.toml` records the allow-list and the reason.

  bench:
    name: bench regression gate (MTS-60 / TRS / KG)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build memnoth
        run: cargo build --locked --bin memnoth

      # MTS and TRS measure a model; without a provider key every task
      # scores zero and the gate fails for want of a credential, not a
      # regression. KG is local and always runs. See the pinned-model job
      # for the same gate.
      - name: Provider key present?
        id: providerkeys
        env:
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          MEMNOTH_API_KEY: ${{ secrets.MEMNOTH_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KILO_API_KEY$MEMNOTH_API_KEY$OPENAI_API_KEY$ANTHROPIC_API_KEY" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No provider key configured: MTS/TRS benches are skipped, KG still runs."
          fi

      # The bench spawns `memnoth ask` for every task (bench.rs reads
      # MEMNOTH_BIN, defaulting to a PATH lookup): the built binary is not on
      # PATH in a fresh checkout, so this died with "spawn memnoth ask: No
      # such file or directory" before any task ran.
      - name: Run MTS-60 bench
        if: steps.providerkeys.outputs.have == 'true'
        env:
          MEMNOTH_BIN: ./target/debug/memnoth
        run: ./target/debug/memnoth bench run --suite mts --n 3 --fail-below 0.5 --json -o ci/mts-result.json

      - name: Run TRS bench
        if: steps.providerkeys.outputs.have == 'true'
        env:
          MEMNOTH_BIN: ./target/debug/memnoth
        run: ./target/debug/memnoth bench run --suite trs --n 3 --fail-below 0.5 --json -o ci/trs-result.json

      - name: Run KG bench
        env:
          MEMNOTH_BIN: ./target/debug/memnoth
        run: ./target/debug/memnoth bench run --suite kg --n 3 --fail-below 0.0 --json -o ci/kg-result.json
